```html
<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>رسالة خاصة</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            background: linear-gradient(135deg, #17152e, #382052, #151522);
            font-family: Arial, sans-serif;
            color: white;
        }

        .card {
            text-align: center;
            padding: 45px 30px;
            margin: 20px;
            width: 90%;
            max-width: 450px;
            background: rgba(255, 255, 255, 0.08);
            border: 1px solid rgba(255, 255, 255, 0.2);
            border-radius: 25px;
            box-shadow: 0 10px 40px rgba(0, 0, 0, 0.3);
            animation: appear 1s ease;
        }

        h1 {
            font-size: clamp(30px, 8vw, 45px);
            color: #d8b4fe;
            text-shadow: 0 0 20px rgba(216, 180, 254, 0.4);
        }

        .heart {
            font-size: 35px;
            margin-bottom: 20px;
            animation: pulse 1.5s infinite;
        }

        @keyframes appear {
            from {
                opacity: 0;
                transform: translateY(20px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        @keyframes pulse {
            50% {
                transform: scale(1.2);
            }
        }
    </style>
</head>

<body>
    <div class="card">
        <div class="heart">💜</div>
        <h1>نيك تاماغ</h1>
    </div>
</body>
</html>
```
